# Tmux installed with homebrew https://github.com/tmux-plugins/tpm/blob/master/docs/tpm_not_working.md
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Allow for alt and other key modifiers within a pane
set -g extended-keys on
set -g extended-keys-format csi-u

# Set prefix to ctrl-space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Ctrl + vim keys without prefix key to switch panes
# FIXME - not working, need to use prefix + vim keys for now
# bind -n C-h select-pane -L
# bind -n C-k select-pane -U
# bind -n C-j select-pane -D
# bind -n C-l select-pane -R

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Show and jump to running Pi agents
bind-key a display-popup \
  -E \
  -w 85% \
  -h 80% \
  "$HOME/.local/bin/pi-agents"

# Show worktrees for the current repository
bind-key t display-popup \
  -E \
  -d "#{pane_current_path}" \
  -w 85% \
  -h 80% \
  "$HOME/.local/bin/wtlist"

# Resize panes with Shift + Alt + Arrow Keys
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @plugin 'tmux-plugins/tmux-yank'

# Configure theme
set -g @onedark_date_format "%Y-%m-%d"
set -g @onedark_time_format "%I:%M %p"

run "~/.config/tmux/theme.tmux"
run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

